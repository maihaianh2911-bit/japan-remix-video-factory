# Thử tạm trên nhánh của phiên chat: các nguồn video khác có đoạn nào cho 伏見稲荷 / 白川郷 / 富士山. Xoá sau khi có kết quả.
name: probe-sources
on:
  push:
    branches: [ccr-d5640a04-6s686r]
    paths: ['.github/workflows/probe-sources.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          cat > p.py <<'EOF'
          import json, re, time, urllib.parse, urllib.request, urllib.error
          UA = "japan-video-factory/1.0 (trial; GitHub Actions) python-urllib"
          BROWSER = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          def get(url, ua=UA):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": ua}), timeout=30) as a:
                      return a.status, a.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, ""
              except Exception as e:
                  return 0, repr(e)[:100]
          def note(t, rows):
              print(f"::notice title={t}::" + "%0A".join(rows)[:3800])
          places = [("fushimi inari", "伏見稲荷"), ("shirakawa", "白川郷"), ("mount fuji", "富士山"), ("kyoto", "京都"), ("torii", "鳥居")]
          rows = []
          for en, ja in places:
              for q in (en, ja):
                  url = ("https://commons.wikimedia.org/w/api.php?action=query&format=json&generator=search&gsrnamespace=6&gsrlimit=50"
                         "&gsrsearch=" + urllib.parse.quote(f"filetype:video {q}") + "&prop=imageinfo&iiprop=size%7Cmime")
                  s, body = get(url); time.sleep(2)
                  try: pages = list(json.loads(body).get("query", {}).get("pages", {}).values())
                  except Exception: pages = []
                  infos = [(p["title"][5:55], (p.get("imageinfo") or [{}])[0]) for p in pages]
                  sharp = [(t, i) for t, i in infos if min(i.get("width", 0), i.get("height", 0)) >= 1080]
                  rows.append(f"{q}: http {s}, {len(pages)} video, {len(sharp)} từ 1080p; " +
                              " | ".join(f"{t} {i.get('width')}x{i.get('height')} {round(i.get('duration',0))}s" for t, i in sharp[:3]))
          note("commons", rows)
          rows = []
          for en, ja in places:
              slug = en.replace(" ", "-")
              s, body = get(f"https://mixkit.co/free-stock-video/{slug}/", BROWSER)
              ids = sorted(set(re.findall(r"/free-stock-video/([a-z0-9-]+-\d+)/", body)))
              s2, body2 = get(f"https://coverr.co/s?q={urllib.parse.quote(en)}", BROWSER)
              mp4 = sorted(set(re.findall(r"https://[^\"'\s\\]+?\.mp4", body2)))
              ai = [m for m in mp4 if "ai-generation" in m]
              titles = sorted(set(re.findall(r'"title":"([^"]{5,60})"', body2)))[:4]
              rows.append(f"{en}: mixkit http {s} {len(ids)} đoạn {ids[:3]} | coverr http {s2} {len(mp4)} mp4 ({len(ai)} AI) {titles}")
          note("mixkit-coverr", rows)
          rows = []
          for en, ja in places[:3]:
              q = urllib.parse.quote(f'"{en}" AND mediatype:movies')
              s, body = get(f"https://archive.org/advancedsearch.php?q={q}&fl[]=identifier&fl[]=title&fl[]=licenseurl&rows=8&output=json")
              try: docs = json.loads(body)["response"]["docs"]
              except Exception: docs = []
              rows.append(f"{en}: http {s}, {len(docs)} | " + " | ".join(f"{d.get('title','')[:50]} [{d.get('licenseurl','?')}]" for d in docs[:4]))
          note("archive", rows)
          rows = []
          for q in ("伏見稲荷 4K 動画", "白川郷 4K 空撮"):
              s, body = get("https://search.yahoo.co.jp/video/search?p=" + urllib.parse.quote(q), BROWSER)
              hosts = re.findall(r"https?://(?:www\.)?(youtube\.com|youtu\.be|tiktok\.com|nicovideo\.jp|dailymotion\.com|vimeo\.com|[a-z0-9.-]+\.(?:jp|com))/", body)
              from collections import Counter
              rows.append(f"{q}: http {s}, trang chứa: {Counter(hosts).most_common(6)}")
          note("yahoo-video", rows)
          EOF
          python3 p.py
