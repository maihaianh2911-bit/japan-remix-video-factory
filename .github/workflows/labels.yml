name: Tạo nhãn

# Tạo (hoặc cập nhật) các nhãn mà dây chuyền dùng. Tự chạy khi file này thay đổi, hoặc chạy tay.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/labels.yml']
  workflow_dispatch:

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-24.04
    steps:
      - name: Tạo nhãn
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
        run: |
          while IFS='|' read -r name color desc; do
            gh label create "$name" --color "$color" --description "$desc" --force
          done <<'LABELS'
          remix|1d76db|Video biến tấu từ video gốc (kênh 10)
          k10|c5def5|Kênh 10: hoàng gia thế giới
          remix-plan|fbca04|Chờ Claude đọc video gốc, viết lại và chia cảnh
          remix-find|c2e0c6|Máy đang tìm ảnh
          remix-pick|fbca04|Chờ Claude chọn ảnh
          remix-render|c2e0c6|Máy đang tạo giọng và dựng video
          remix-check|fbca04|Chờ Claude kiểm tra từng cảnh
          remix-done|0b6e3a|Video xong
          remix-fix|e99695|Chủ kênh yêu cầu sửa
          remix-failed|b60205|Máy gặp lỗi
          remix-busy|5319e7|Claude đang làm phiếu này
          LABELS
