# Thử tạm trên nhánh của phiên chat (không đụng main): mã Pixabay có chạy không, và video cảnh đẹp ra sao. Xoá sau khi có kết quả.
name: probe-pixabay
on:
  push:
    branches: [ccr-d5640a04-6s686r]
    paths: ['.github/workflows/probe-pixabay.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ccr-d5640a04-6s686r
      - name: search and sample
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk >/dev/null
          mkdir -p probe-out clips
          cat > probe.py <<'EOF'
          import json, os, subprocess, sys, urllib.parse, urllib.request
          KEY = os.environ.get("PIXABAY_API_KEY", "")
          if not KEY:
              print("::error title=pixabay::KHÔNG CÓ MÃ (secret PIXABAY_API_KEY trống hoặc chưa có)")
              sys.exit(1)
          SEARCHES = [("ja", "富士山"), ("ja", "京都"), ("ja", "桜"), ("ja", "紅葉"), ("ja", "雪景色"), ("ja", "東京 夜景"),
                      ("en", "mount fuji"), ("en", "kyoto temple"), ("en", "cherry blossom japan"),
                      ("en", "autumn leaves japan"), ("en", "tokyo night"), ("en", "japan village snow")]
          def ai(hit):
              tags = (hit.get("tags") or "").lower()
              return "ai generated" in tags or "ai-generated" in tags or hit.get("isAiGenerated") or hit.get("is_ai_generated")
          rows, picks, first = [], [], None
          for lang, words in SEARCHES:
              url = ("https://pixabay.com/api/videos/?" + urllib.parse.urlencode(
                  {"key": KEY, "q": words, "lang": lang, "per_page": 50, "safesearch": "true"}))
              try:
                  data = json.load(urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "video-factory"}), timeout=30))
              except Exception as error:
                  rows.append(f"{words}: LỖI {str(error).replace(KEY, '***')[:120]}")
                  continue
              hits = data.get("hits", [])
              first = first or (hits[0] if hits else None)
              real = [h for h in hits if not ai(h)]
              tall = [h for h in real if h["videos"]["large"]["height"] > h["videos"]["large"]["width"] or
                      h["videos"]["medium"]["height"] > h["videos"]["medium"]["width"]]
              sharp = [h for h in real if max(h["videos"]["large"]["width"], h["videos"]["large"]["height"]) >= 1920]
              rows.append(f"{words}: tổng {data.get('totalHits')}, trong 50 đầu: {len(hits) - len(real)} AI bị bỏ, "
                          f"{len(tall)} dọc, {len(sharp)} từ 1080p trở lên")
              best = sorted(real, key=lambda h: (-(h['videos']['large']['height'] > h['videos']['large']['width']),
                                                  -h["videos"]["large"]["width"], -h.get("downloads", 0)))
              if best:
                  h = best[0]
                  v = h["videos"]["large"] if h["videos"]["large"]["url"] else h["videos"]["medium"]
                  picks.append({"words": words, "id": h["id"], "url": v["url"], "w": v["width"], "h": v["height"],
                                "sec": h["duration"], "page": h["pageURL"], "user": h["user"], "tags": h["tags"]})
          if first:
              keys = sorted(first.keys())
              rows.append("các trường: " + ", ".join(keys))
          print("::notice title=pixabay::" + "%0A".join(rows))
          json.dump(picks, open("probe-out/picks.json", "w"), ensure_ascii=False, indent=1)
          for n, p in enumerate(picks, 1):
              out = f"clips/{n:02d}.mp4"
              subprocess.run(["curl", "-sSL", "-A", "video-factory", "-o", out, p["url"]], check=False)
              mid = max(0.5, p["sec"] / 2)
              label = f"{n}. {p['words']}  {p['w']}x{p['h']}  {p['sec']}s"
              vf = ("scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,"
                    f"drawtext=fontfile=/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc:text='{label}':"
                    "x=20:y=20:fontsize=44:fontcolor=white:box=1:boxcolor=black@0.6")
              subprocess.run(["ffmpeg", "-v", "error", "-y", "-ss", str(mid), "-i", out, "-frames:v", "1", "-vf", vf,
                              f"probe-out/f{n:02d}.jpg"], check=False)
          print("::notice title=picks::" + "%0A".join(f"{n}. {p['words']}: {p['w']}x{p['h']}, {p['sec']}s, {p['page']}"
                                                      for n, p in enumerate(picks, 1)))
          EOF
          python3 probe.py
          ls probe-out
          ffmpeg -v error -y -pattern_type glob -i 'probe-out/f*.jpg' -vf "scale=360:640,tile=6x2" -frames:v 1 -q:v 3 probe-out/sheet.jpg
          # một đoạn mẫu thật: 3 giây của 3 cảnh đầu, khung dọc, để xem độ nét khi chạy
          for n in 01 02 03; do ffmpeg -v error -y -ss 1 -t 3 -i clips/$n.mp4 -an -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=30" -c:v libx264 -crf 23 -pix_fmt yuv420p clips/s$n.mp4; done
          printf "file 's01.mp4'\nfile 's02.mp4'\nfile 's03.mp4'\n" > clips/list.txt
          ffmpeg -v error -y -f concat -safe 0 -i clips/list.txt -c copy probe-out/sample.mp4
          rm -f probe-out/f*.jpg
          mkdir -p probe-results && cp probe-out/sheet.jpg probe-out/sample.mp4 probe-out/picks.json probe-results/
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add probe-results && git commit -q -m "Kết quả thử Pixabay (tạm, sẽ xoá)" && git push -q origin HEAD:ccr-d5640a04-6s686r
