# Bản thử video dựng bằng đoạn video (tạm, chỉ trên nhánh của phiên chat; không đụng main).
name: clip-trial
on:
  push:
    branches: [ccr-d5640a04-6s686r]
    paths: ['trials/*.json', 'trials/active.txt', 'tools/clip_trial.py', '.github/workflows/clip-trial.yml']
permissions:
  contents: write
concurrency: clip-trial
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ccr-d5640a04-6s686r
      - name: pictures downloaded before
        uses: actions/cache/restore@v4
        with:
          path: trials/media
          key: trial-media-${{ github.run_id }}
          restore-keys: trial-media-
      - name: setup
        run: |
          python -m pip install -q -r requirements.txt
          bash tools/install_deps.sh
          mkdir -p fonts
          curl -fsSL -o fonts/MPLUSRounded1c-ExtraBold.ttf \
            https://raw.githubusercontent.com/google/fonts/main/ofl/mplusrounded1c/MPLUSRounded1c-ExtraBold.ttf \
            || echo "::warning::không tải được phông M PLUS Rounded: dùng Noto"
      - name: voice engine
        run: |
          NAME=$(cat trials/active.txt)                     # the video being made: trials/<name>.json
          STAGE=$(python -c "import json;print(json.load(open('trials/$NAME.json'))['stage'])")
          echo "STAGE=$STAGE" >> $GITHUB_ENV
          echo "NAME=$NAME" >> $GITHUB_ENV
          if [ "$STAGE" = render ]; then
            docker run --detach --name voicevox --publish 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-0.26.1
            for i in $(seq 1 60); do curl -fs --max-time 4 http://127.0.0.1:50021/version && exit 0; sleep 3; done
            docker logs voicevox; exit 1
          fi
      - name: run
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python tools/clip_trial.py "$STAGE" trials/$NAME.json trials/out/$NAME/$STAGE
          rm -rf trials/out/$NAME/$STAGE/work trials/out/$NAME/$STAGE/frames
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add trials/out && git commit -q -m "$NAME: kết quả bước $STAGE" && git pull -q --rebase origin ccr-d5640a04-6s686r && git push -q origin HEAD:ccr-d5640a04-6s686r
      - name: keep the downloaded pictures for the next run (also when this one failed)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: trials/media
          key: trial-media-${{ github.run_id }}
