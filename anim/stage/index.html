<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>anim stage</title>
<style>
@font-face { font-family: "Gothic"; font-weight: 900; src: url(/lib/noto-sans-jp-900.woff2) format("woff2"); }
@font-face { font-family: "Gothic"; font-weight: 700; src: url(/lib/noto-sans-jp-700.woff2) format("woff2"); }
@font-face { font-family: "Mincho"; font-weight: 800; src: url(/lib/shippori-mincho-b1-800.woff2) format("woff2"); }

:root {
  --ink: #0b0f27; --navy: #121838; --sea: #1a2554; --gold: #f2c95c; --gold-deep: #b98a25;
  --red: #d8392b; --blue: #2f5fa8; --land: #eadfc3; --paper: #f6eed9; --slate: #46536e;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
#frame { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: #fff; font-family: "Gothic", sans-serif;
  background: radial-gradient(1300px 1000px at 50% 20%, #202b60 0%, #131a3d 52%, #0a0e25 100%); }
#weave { position: absolute; inset: 0; opacity: .05; }

/* the top: the title of the video, there from the first frame */
#tag { position: absolute; top: 148px; left: 0; width: 100%; text-align: center; font-weight: 700; font-size: 34px;
  letter-spacing: .42em; text-indent: .42em; color: var(--gold); }
#tag::before, #tag::after { content: ""; display: inline-block; width: 64px; height: 2px; margin: 0 22px 11px;
  background: var(--gold-deep); }
#title { position: absolute; top: 208px; left: 0; width: 100%; text-align: center; font-family: "Mincho", serif;
  font-weight: 800; font-size: 90px; line-height: 1.27; letter-spacing: .02em; text-shadow: 0 6px 22px rgba(0,0,0,.55); }
.gold { color: var(--gold); }

/* the middle: the animated panel */
#panel { position: absolute; left: 0; top: 612px; width: 1080px; height: 690px; overflow: hidden; background: var(--sea); }
.rule { position: absolute; left: 0; width: 1080px; height: 6px; z-index: 5;
  background: linear-gradient(90deg, #8a651b, #f6dc8c 30%, #f2c95c 50%, #f6dc8c 70%, #8a651b); }
.scene { position: absolute; inset: 0; overflow: hidden; }
.scene.paper { background: radial-gradient(950px 620px at 58% 42%, #fdf7e6, #f1e6ca 68%, #e2d3ae); color: #1d2440; }
.scene.paper::after { content: ""; position: absolute; inset: 0; opacity: .5;
  background-image: radial-gradient(rgba(120,96,48,.16) 1.2px, transparent 1.4px); background-size: 22px 22px; }
.scene.night { background: radial-gradient(640px 520px at 50% 56%, #2b3a80 0%, #151c44 60%, #0b0f27 100%); }
.scene > * { z-index: 1; }
.shade { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(900px 620px at 45% 50%, rgba(8,12,32,0) 55%, rgba(8,12,32,.55) 100%); }
.chip { position: absolute; left: 22px; top: 22px; padding: 7px 18px 9px; border-radius: 6px; font-weight: 900;
  font-size: 27px; letter-spacing: .08em; background: var(--gold); color: var(--ink); box-shadow: 0 4px 12px rgba(0,0,0,.35); }
.scene.paper .chip { background: #1d2440; color: var(--gold); }

/* the map */
.land { fill: var(--land); stroke: #b3a680; stroke-width: 1; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.lit { stroke: rgba(0,0,0,.35); stroke-width: 1.2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.grid { fill: none; stroke: rgba(255,255,255,.07); stroke-width: 1; vector-effect: non-scaling-stroke; }
.pin { position: absolute; left: 0; top: 0; }
.pin .tip { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; background: #fff;
  border: 4px solid var(--ink); }
.pin .name { position: absolute; white-space: nowrap; padding: 6px 20px 9px; border-radius: 10px; font-weight: 900; font-size: 40px;
  background: var(--ink); color: #fff; border: 3px solid var(--gold); box-shadow: 0 6px 16px rgba(0,0,0,.45); transform-origin: 50% 100%; }
.pin .q { position: absolute; right: -26px; top: -30px; width: 50px; height: 50px; border-radius: 50%; background: var(--gold);
  color: var(--ink); font-weight: 900; font-size: 36px; line-height: 46px; text-align: center; border: 3px solid var(--ink); }
.ring { fill: none; stroke: var(--gold); stroke-width: 5; }

/* the mascot */
#mascot { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 4; }
#mascot .body { position: absolute; transform-origin: 50% 100%; }
#mascot img { position: absolute; left: 0; bottom: 0; filter: drop-shadow(0 10px 14px rgba(0,0,0,.35)); }

/* cards and figures on paper */
.head { position: absolute; font-family: "Mincho", serif; font-weight: 800; font-size: 50px; color: #1d2440; white-space: nowrap; }
.note { position: absolute; font-weight: 700; font-size: 24px; color: #6b6248; white-space: nowrap; }
.label { position: absolute; font-weight: 900; font-size: 38px; color: #1d2440; white-space: nowrap; text-align: center; }
.vs { position: absolute; font-family: "Mincho", serif; font-weight: 800; font-size: 66px; color: var(--gold-deep); font-style: italic; }
.bar { position: absolute; height: 58px; border-radius: 8px; box-shadow: 0 5px 0 rgba(0,0,0,.14); transform-origin: 0 50%; }
.bar-name { position: absolute; font-weight: 900; font-size: 34px; color: #1d2440; text-align: right; width: 170px; white-space: nowrap; }
.bar-value { position: absolute; font-weight: 900; font-size: 46px; white-space: nowrap; }
.big { position: absolute; font-weight: 900; white-space: nowrap; text-align: center; }
.stamp { position: absolute; padding: 4px 22px 8px; border: 6px solid var(--red); border-radius: 12px; color: var(--red);
  font-weight: 900; font-size: 52px; background: rgba(255,250,240,.88); white-space: nowrap; }
.mark { position: absolute; font-family: "Mincho", serif; font-weight: 800; color: var(--gold); text-shadow: 0 8px 30px rgba(0,0,0,.5); }

/* the foot: the words being spoken, the key words in gold */
#captions { position: absolute; left: 0; top: 1336px; width: 1080px; height: 240px; }
.cap { position: absolute; left: 0; top: 0; width: 1080px; height: 240px; display: flex; align-items: center; justify-content: center;
  text-align: center; font-weight: 900; font-size: 68px; line-height: 1.32; letter-spacing: .01em;
  -webkit-text-stroke: 12px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 rgba(0,0,0,.35); }
.cap .gold { color: #ffd65a; }
</style>
</head>
<body>
<div id="frame">
  <svg id="weave" width="1080" height="1920">
    <defs><pattern id="seigaiha" width="80" height="40" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#fff" stroke-width="2">
        <circle cx="40" cy="40" r="38"/><circle cx="40" cy="40" r="26"/><circle cx="40" cy="40" r="14"/>
        <circle cx="0" cy="20" r="38"/><circle cx="0" cy="20" r="26"/><circle cx="0" cy="20" r="14"/>
        <circle cx="80" cy="20" r="38"/><circle cx="80" cy="20" r="26"/><circle cx="80" cy="20" r="14"/>
      </g></pattern></defs>
    <rect width="1080" height="1920" fill="url(#seigaiha)"/>
  </svg>
  <div id="tag"></div>
  <div id="title"></div>
  <div id="panel"><div class="rule" style="top:0"></div><div class="rule" style="bottom:0"></div><div id="mascot"></div></div>
  <div id="captions"></div>
</div>
<script src="/lib/d3-array.min.js"></script>
<script src="/lib/d3-geo.min.js"></script>
<script src="/lib/topojson-client.min.js"></script>
<script src="/engine.js"></script>
<script src="/parts.js"></script>
<script src="/trial.js"></script>
<script>
window.ready = (async () => {
  const [timing, world] = await Promise.all(["/out/timing.json", "/lib/countries-50m.json"].map(u => fetch(u).then(r => r.json())));
  const stage = new Anim.Stage(timing);
  await window.TRIAL(stage, { world });
  await stage.settle();
  window.DURATION = timing.duration;
  window.seek = t => stage.tl.seek(t);
  window.seek(0);
  return timing.duration;
})();
</script>
</body>
</html>
